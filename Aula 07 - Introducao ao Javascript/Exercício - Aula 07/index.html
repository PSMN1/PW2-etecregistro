<script>
    const n1 = Number(window.prompt("Digite um número: "));
    const n2 = Number(window.prompt("Digite um outro número: "));
    const resultadosoma = n1 + n2;
    const resultadosubtracao = n1 - n2;
    const resultadomultiplicacao = n1 * n2;
    const resultadodivisao = n1 / n2;
    document.write(`A soma de ${n1} + ${n2} é igual a ${resultadosoma}, a subtração de ${n1} - ${n2} é igual a ${resultadosubtracao}, a multiplicação de ${n1} * ${n2} é igual a ${resultadomultiplicacao} e a divisão de ${n1} / ${n2} é igual a ${resultadodivisao}`);
</script>
