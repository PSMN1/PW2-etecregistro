</head>
<body>
    <h1>Calculadora com Javascript</h1>
    
    <input type="number" name="inputN1" id="inputN1" min="0" max="999">
    <input type="number" name="inputN2" id="inputN2" min="0" max="999">
    <br><br>
    <!-- Botão somar -->
    <button type="button" onclick="somar()">Somar</button>
    <!-- Botão limpar -->
     <button type="button" onclick="limpar()">Limpar</button>
    <!-- Resultado -->
     <div id="resultado">=</div>





    
</body>
