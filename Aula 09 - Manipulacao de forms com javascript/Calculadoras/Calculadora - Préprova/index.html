<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Nível Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="titulo">Calculadora</h1>
    <div id="calculadora">
        Digite o primeiro número: <br>
        <input type="number" id="num1"><br><br>
        Digite o segundo número: <br>
        <input type="number" id="num2"><br><br>
        Digite o operador: <br>
        <input type="text" id="operador"><br><br>
        <button type="button" id="botaocalculo" onclick="calcular()">Calcular</button>
        <button type="button" id="botaolimpar" onclick="limpar()">Limpar</button><br><br>
        Resultado:
        <div id="resultado"></div>
    </div>
</body>
<script src="script.js"></script>
</html>
